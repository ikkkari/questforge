      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="fennieGlow" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
