<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" class="companion-svg companion-ollie-svg">
  <defs>
    <radialGradient id="ollieAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="olliePlumage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ollieBreast" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="ollieEyeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="ollieRuneGlow" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="170" r="130" fill="url(#ollieAura)"/>

  <g class="comp-particles-group" filter="url(#ollieRuneGlow)">
    <circle cx="85" cy="90" r="3.5" fill="#a5f3fc" opacity="0.8"/>
    <circle cx="240" cy="85" r="4" fill="#e0e7ff" opacity="0.75"/>
    <circle cx="260" cy="160" r="3" fill="#fef08a" opacity="0.7"/>
    <circle cx="65" cy="180" r="3" fill="#c084fc" opacity="0.8"/>
  </g>

  <g class="ollie-perch" filter="url(#ollieRuneGlow)">
    <ellipse cx="160" cy="270" rx="65" ry="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="160" cy="270" r="4" fill="#38bdf8"/>
  </g>

  <g fill="#f59e0b">
    <ellipse cx="142" cy="265" rx="7" ry="5"/>
    <ellipse cx="148" cy="266" rx="7" ry="5"/>
    <ellipse cx="172" cy="266" rx="7" ry="5"/>
    <ellipse cx="178" cy="265" rx="7" ry="5"/>
  </g>

  <g class="comp-body-group ollie-body">
    <ellipse cx="160" cy="205" rx="50" ry="55" fill="url(#olliePlumage)"/>
    <path d="M135 175 C125 210 135 245 160 250 C185 245 195 210 185 175 C175 185 145 185 135 175 Z" fill="url(#ollieBreast)"/>
    <path d="M150 195 Q155 200 160 195" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M165 205 Q170 210 175 205" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M145 215 Q150 220 155 215" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <g class="ollie-wings">
    <path d="M118 175 C95 190 90 230 115 245 C120 230 125 200 128 185 Z" fill="url(#olliePlumage)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="105" cy="235" r="2.5" fill="#a5f3fc" filter="url(#ollieRuneGlow)"/>
    <path d="M202 175 C225 190 230 230 205 245 C200 230 195 200 192 185 Z" fill="url(#olliePlumage)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="215" cy="235" r="2.5" fill="#a5f3fc" filter="url(#ollieRuneGlow)"/>
  </g>

  <g class="comp-head-group ollie-head">
    <path d="M125 110 C105 75 90 60 110 50 C125 58 135 85 138 108 Z" fill="url(#olliePlumage)"/>
    <path d="M195 110 C215 75 230 60 210 50 C195 58 185 85 182 108 Z" fill="url(#olliePlumage)"/>
    <circle cx="105" cy="56" r="2.5" fill="#fef08a" filter="url(#ollieRuneGlow)"/>
    <circle cx="215" cy="56" r="2.5" fill="#fef08a" filter="url(#ollieRuneGlow)"/>

    <ellipse cx="160" cy="138" rx="48" ry="40" fill="url(#olliePlumage)"/>
    <circle cx="136" cy="138" r="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <circle cx="184" cy="138" r="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>

    <g class="comp-eye ollie-eye-l">
      <circle cx="136" cy="138" r="16" fill="url(#ollieEyeGrad)"/>
      <circle cx="136" cy="138" r="9" fill="#0f172a"/>
      <circle cx="132" cy="133" r="4.5" fill="#ffffff"/>
      <circle cx="140" cy="143" r="2" fill="#ffffff" opacity="0.9"/>
    </g>
    <g class="comp-eye ollie-eye-r">
      <circle cx="184" cy="138" r="16" fill="url(#ollieEyeGrad)"/>
      <circle cx="184" cy="138" r="9" fill="#0f172a"/>
      <circle cx="180" cy="133" r="4.5" fill="#ffffff"/>
      <circle cx="188" cy="143" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <polygon points="156,145 164,145 160,158" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
    <polygon points="160,105 163,112 170,115 163,118 160,125 157,118 150,115 157,112" fill="#fef08a" filter="url(#ollieRuneGlow)"/>
  </g>
</svg>