<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" class="companion-svg companion-boo-svg">
  <defs>
    <radialGradient id="booAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="booBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5f3ff"/>
      <stop offset="80%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="booEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <filter id="booGhostGlow" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="130" fill="url(#booAura)"/>

  <g class="comp-particles-group" filter="url(#booGhostGlow)">
    <circle cx="80" cy="120" r="4.5" fill="#e9d5ff" opacity="0.75"/>
    <circle cx="240" cy="100" r="4" fill="#c084fc" opacity="0.7"/>
    <circle cx="250" cy="180" r="3.5" fill="#a5f3fc" opacity="0.7"/>
    <circle cx="70" cy="210" r="3" fill="#ddd6fe" opacity="0.8"/>
  </g>

  <g class="boo-halo" filter="url(#booGhostGlow)">
    <ellipse cx="160" cy="65" rx="35" ry="9" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.85"/>
    <circle cx="192" cy="65" r="3" fill="#c084fc"/>
  </g>

  <g class="comp-body-group boo-body" filter="url(#booGhostGlow)">
    <path d="M110 140 C110 85 130 70 160 70 C190 70 210 85 210 140 C210 185 220 220 205 245 C195 240 188 230 180 245 C172 235 165 230 160 245 C155 230 148 235 140 245 C132 230 125 240 115 245 C100 220 110 185 110 140 Z" fill="url(#booBodyGrad)" opacity="0.95"/>
    <ellipse cx="160" cy="150" rx="36" ry="48" fill="#c084fc" opacity="0.2"/>
  </g>

  <g class="boo-arms">
    <path d="M112 155 C95 150 85 165 95 175 C105 180 114 170 116 165 Z" fill="url(#booBodyGrad)"/>
    <path d="M208 155 C225 150 235 165 225 175 C215 180 206 170 204 165 Z" fill="url(#booBodyGrad)"/>
  </g>

  <ellipse cx="132" cy="155" rx="8" ry="5" fill="#c084fc" opacity="0.45"/>
  <ellipse cx="188" cy="155" rx="8" ry="5" fill="#c084fc" opacity="0.45"/>

  <g class="comp-eye boo-eye-l">
    <ellipse cx="142" cy="142" rx="10" ry="13" fill="url(#booEye)"/>
    <polygon points="139,134 141,138 145,139 141,141 139,145 137,141 133,139 137,138" fill="#ffffff"/>
    <circle cx="145" cy="147" r="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <g class="comp-eye boo-eye-r">
    <ellipse cx="178" cy="142" rx="10" ry="13" fill="url(#booEye)"/>
    <polygon points="175,134 177,138 181,139 177,141 175,145 173,141 169,139 173,138" fill="#ffffff"/>
    <circle cx="181" cy="147" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <ellipse cx="160" cy="158" rx="3.5" ry="4" fill="#581c87"/>
</svg>